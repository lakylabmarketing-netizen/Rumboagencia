  <script>
    (function () {
      // Código QR de ejemplo, determinista (semilla fija): solo decorativo, no enlaza a nada
      const svg = document.getElementById("apps-qrsvg");
      let s = 20261030; const rnd = () => ((s = (s * 1103515245 + 12345) % 2147483648) / 2147483648);
      const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0B0B0B"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#F04E17"/>`;
      let cells = "";
      for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
        const inFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
        if (!inFinder && rnd() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#0B0B0B"/>`;
      }
      svg.innerHTML = `<g id="apps-qrcells">${cells}</g>${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}`;

      const tl = gsap.timeline({ paused: true });
      const names = ["#apps-n1", "#apps-n2", "#apps-n3", "#apps-n4"];
      const stages = ["#apps-cal", "#apps-qr", "#apps-card", "#apps-map"];

      // Kicker y primera app
      tl.fromTo("#apps-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.25);
      tl.fromTo("#apps-n1", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 0.15);
      tl.fromTo("#apps-cal", { scale: 0.7, y: 40 }, { scale: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#apps-cal .apps-shift", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.35, stagger: 0.07, ease: "back.out(1.6)" }, 0.45);

      // Cambio de app: la anterior se desenfoca y sale, la siguiente aterriza en el mismo escenario
      const swap = (i, t) => {
        tl.to(names[i - 1], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, t);
        tl.to(stages[i - 1], { opacity: 0, scale: 0.9, filter: "blur(12px)", duration: 0.22, ease: "power3.in" }, t);
        tl.fromTo(names[i], { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, t + 0.18);
        tl.fromTo(stages[i], { opacity: 0, scale: 1.12, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t + 0.16);
      };
      swap(1, 2.0);
      tl.fromTo("#apps-qrcells", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.9, ease: "power2.inOut" }, 2.4);
      swap(2, 4.0);
      tl.fromTo("#apps-card .apps-stamp i", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.14, ease: "back.out(1.8)" }, 4.45);
      swap(3, 6.0);
      tl.to("#apps-route", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 6.35);
      ["#apps-pin1", "#apps-pin2", "#apps-pin3"].forEach((p, i) =>
        tl.fromTo(p, { scale: 0, rotation: -45, transformOrigin: "0% 100%" }, { scale: 1, rotation: -45, duration: 0.35, ease: "back.out(1.8)" }, 6.3 + i * 0.4));

      // Salida hacia la noche: todo se recoge al centro
      tl.to(["#apps-kicker", "#apps-n4"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 7.65);
      tl.to("#apps-map", { scale: 0.2, opacity: 0, duration: 0.3, ease: "power3.in" }, 7.65);

      window.__timelines = window.__timelines || {};
      window.__timelines["apps"] = tl;
    })();
  </script>
